<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SeWa OS</title>
<style>
  :root{
    --accent:#7c3aed;
    --bg:#08090d;
    --panel:rgba(18,20,28,.72);
    --panel-solid:#151821;
    --text:#f6f7fb;
    --muted:#9ca3af;
    --border:rgba(255,255,255,.10);
    --shadow:0 25px 80px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,Segoe UI,Arial,sans-serif;background:#05060a;color:var(--text);user-select:none}
  button,input,textarea{font:inherit}
  button{color:inherit}
  #boot{
    position:fixed;inset:0;z-index:9999;background:#05060a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
    transition:.6s ease;
  }
  .boot-logo{font-size:46px;font-weight:800;letter-spacing:-2px}
  .boot-logo b{color:var(--accent)}
  .loader{width:190px;height:4px;background:#1b1f2a;border-radius:999px;overflow:hidden}
  .loader::after{content:"";display:block;height:100%;width:45%;background:var(--accent);border-radius:999px;animation:load 1.1s infinite ease-in-out}
  @keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(330%)}}
  #desktop{
    position:fixed;inset:0 0 54px 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(124,58,237,.18), transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(59,130,246,.12), transparent 32%),
      linear-gradient(145deg,#080a10,#111528);
    overflow:hidden;
  }
  #desktop.wallpaper-2{
    background:
      radial-gradient(circle at 50% -20%, rgba(255,255,255,.14),transparent 35%),
      linear-gradient(140deg,#111,#2a2a2a 50%,#0b0b0b);
  }
  #desktop.wallpaper-3{
    background:
      radial-gradient(circle at 22% 30%,rgba(34,197,94,.25),transparent 25%),
      radial-gradient(circle at 75% 65%,rgba(14,165,233,.2),transparent 25%),
      linear-gradient(135deg,#03140f,#071c29);
  }
  .brand{
    position:absolute;right:28px;bottom:28px;text-align:right;opacity:.32;pointer-events:none
  }
  .brand .big{font-size:58px;font-weight:900;letter-spacing:-4px}
  .brand .small{font-size:12px;letter-spacing:4px;text-transform:uppercase}
  #icons{display:grid;grid-template-columns:repeat(auto-fill,88px);grid-auto-rows:96px;gap:8px;padding:18px;width:210px}
  .desktop-icon{
    width:84px;height:88px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    font-size:12px;text-align:center;padding:6px;cursor:default;border:1px solid transparent
  }
  .desktop-icon:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.06)}
  .desktop-icon .ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  #taskbar{
    position:fixed;left:0;right:0;bottom:0;height:54px;z-index:9000;background:rgba(10,12,18,.78);backdrop-filter:blur(20px);
    border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:6px 10px
  }
  .task-btn{height:40px;min-width:40px;border:0;border-radius:11px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .task-btn:hover{background:rgba(255,255,255,.08)}
  .task-btn.active{background:rgba(255,255,255,.11)}
  .start-logo{font-weight:900;font-size:17px}
  .start-logo b{color:var(--accent)}
  #taskApps{display:flex;gap:5px;flex:1}
  #tray{display:flex;align-items:center;gap:10px;font-size:12px;color:#d8dbe4;padding:0 6px}
  #clock{text-align:right;line-height:1.15;min-width:72px}
  #startMenu{
    position:fixed;left:10px;bottom:62px;z-index:9100;width:360px;max-height:560px;padding:14px;border-radius:20px;
    background:rgba(18,20,29,.88);backdrop-filter:blur(26px);border:1px solid var(--border);box-shadow:var(--shadow);
    opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:.18s ease
  }
  #startMenu.open{opacity:1;transform:none;pointer-events:auto}
  .search{
    width:100%;height:42px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:white;padding:0 14px;outline:none
  }
  .section-title{font-size:12px;color:var(--muted);margin:14px 4px 8px;text-transform:uppercase;letter-spacing:1px}
  .app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .app-tile{padding:10px 6px;border-radius:12px;text-align:center;font-size:11px;cursor:pointer}
  .app-tile:hover{background:rgba(255,255,255,.07)}
  .app-tile .tile-ico{font-size:23px;margin-bottom:6px}
  .menu-footer{display:flex;align-items:center;justify-content:space-between;margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  .user{display:flex;align-items:center;gap:9px;font-size:13px}
  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#2563eb);display:grid;place-items:center;font-weight:800}
  .window{
    position:absolute;width:650px;height:430px;min-width:300px;min-height:220px;background:rgba(17,20,28,.92);backdrop-filter:blur(20px);
    border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:none;resize:both
  }
  .window.show{display:block}
  .window.max{left:8px!important;top:8px!important;width:calc(100% - 16px)!important;height:calc(100% - 16px)!important;resize:none}
  .titlebar{height:46px;display:flex;align-items:center;border-bottom:1px solid var(--border);padding-left:14px;cursor:move}
  .titlebar .title{flex:1;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
  .win-actions{display:flex;height:100%}
  .win-actions button{width:46px;border:0;background:transparent;cursor:pointer}
  .win-actions button:hover{background:rgba(255,255,255,.08)}
  .win-actions .close:hover{background:#ef4444}
  .content{height:calc(100% - 46px);overflow:auto}
  .pad{padding:16px}
  textarea.note{
    width:100%;height:100%;resize:none;border:0;outline:none;background:#0d1017;color:#f7f7f7;padding:18px;font-size:15px;line-height:1.6;user-select:text
  }
  .calc{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;height:100%}
  .calc-display{grid-column:1/-1;height:76px;border-radius:13px;background:#090b10;border:1px solid var(--border);padding:16px;text-align:right;font-size:30px;overflow:hidden;user-select:text}
  .calc button{border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.06);cursor:pointer;font-size:17px}
  .calc button:hover{background:rgba(255,255,255,.11)}
  .calc .accent{background:color-mix(in srgb,var(--accent) 70%, #111)}
  .terminal{height:100%;padding:14px;background:#05060a;color:#d7ffd7;font-family:Consolas,monospace;font-size:13px;overflow:auto;user-select:text}
  .term-line{white-space:pre-wrap}
  .term-row{display:flex;gap:8px;margin-top:4px}
  .prompt{color:#a78bfa}
  .term-input{flex:1;background:transparent;color:#d7ffd7;border:0;outline:0;font-family:inherit}
  .settings{display:grid;grid-template-columns:180px 1fr;height:100%}
  .sidebar{border-right:1px solid var(--border);padding:12px}
  .side-item{padding:11px;border-radius:10px;font-size:13px;margin-bottom:4px}
  .side-item.active,.side-item:hover{background:rgba(255,255,255,.07)}
  .setting-page{padding:22px;overflow:auto}
  .setting-card{border:1px solid var(--border);background:rgba(255,255,255,.035);padding:16px;border-radius:14px;margin:12px 0}
  .swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .swatch{width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.15);cursor:pointer}
  .wallpapers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .wall{aspect-ratio:16/9;border-radius:10px;border:2px solid var(--border);cursor:pointer}
  .w1{background:linear-gradient(145deg,#080a10,#111528)}
  .w2{background:linear-gradient(140deg,#111,#2a2a2a,#0b0b0b)}
  .w3{background:linear-gradient(135deg,#03140f,#071c29)}
  .files{display:grid;grid-template-columns:180px 1fr;height:100%}
  .file-list{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;align-content:start}
  .file{padding:14px 8px;border-radius:12px;text-align:center;border:1px solid var(--border);background:rgba(255,255,255,.035);font-size:12px}
  .file .ficon{font-size:28px;margin-bottom:8px}
  .browser{display:flex;flex-direction:column;height:100%}
  .browserbar{display:flex;gap:8px;padding:9px;border-bottom:1px solid var(--border)}
  .browserbar input{flex:1;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;color:white;padding:8px 12px;outline:0;user-select:text}
  .browserbar button{border:0;background:rgba(255,255,255,.08);border-radius:10px;padding:0 12px;cursor:pointer}
  .browserpage{flex:1;display:grid;place-items:center;text-align:center;padding:30px}
  .browserpage h1{font-size:42px;margin:0 0 8px}
  .browserpage b{color:var(--accent)}
  .browserpage p{color:var(--muted);max-width:500px}
  .system-card{max-width:620px;padding:24px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.04)}
  .system-logo{font-size:54px;font-weight:900;letter-spacing:-3px}
  .system-logo b{color:var(--accent)}
  .toast{position:fixed;right:16px;bottom:70px;z-index:9900;padding:13px 16px;border-radius:12px;background:rgba(20,23,31,.95);border:1px solid var(--border);box-shadow:var(--shadow);font-size:13px;transform:translateX(130%);transition:.25s}
  .toast.show{transform:none}
  @media(max-width:700px){
    .window{width:calc(100% - 12px)!important;height:calc(100% - 12px)!important;left:6px!important;top:6px!important;border-radius:13px;resize:none}
    #startMenu{left:8px;right:8px;width:auto}
    .settings,.files{grid-template-columns:1fr}
    .settings .sidebar,.files .sidebar{display:none}
    .brand{display:none}
    #tray .status{display:none}
  }
</style>
</head>
<body>
<div id="boot">
  <div class="boot-logo">SeWa <b>OS</b></div>
  <div class="loader"></div>
  <div style="color:#777;font-size:12px">Starting SeWa OS...</div>
</div>

<div id="desktop">
  <div id="icons"></div>
  <div class="brand"><div class="big">SeWa OS</div><div class="small">Web Operating System</div></div>
</div>

<div id="startMenu">
  <input id="search" class="search" placeholder="Пошук програм..." />
  <div class="section-title">Програми</div>
  <div class="app-grid" id="appGrid"></div>
  <div class="menu-footer">
    <div class="user"><div class="avatar">S</div><div><b>SeWa</b><div style="color:#8e95a5;font-size:11px">Administrator</div></div></div>
    <button class="task-btn" onclick="fakePower()" title="Живлення">⏻</button>
  </div>
</div>

<div id="taskbar">
  <button class="task-btn start-logo" id="startBtn">SeWa <b>OS</b></button>
  <div id="taskApps"></div>
  <div id="tray"><span class="status">◉ Wi-Fi</span><span>🔊</span><div id="clock"></div></div>
</div>

<div id="toast" class="toast">Готово</div>

<script>
const apps = [
  {id:'browser',name:'SeWa Browser',icon:'🌐'},
  {id:'files',name:'Файли',icon:'📁'},
  {id:'notes',name:'Нотатки',icon:'📝'},
  {id:'calc',name:'Калькулятор',icon:'🧮'},
  {id:'terminal',name:'Термінал',icon:'⌨️'},
  {id:'settings',name:'Налаштування',icon:'⚙️'},
  {id:'about',name:'Про систему',icon:'💻'}
];
const desktopApps=['browser','files','notes','terminal','settings'];

const appGrid=document.getElementById('appGrid');
const icons=document.getElementById('icons');
const taskApps=document.getElementById('taskApps');
const startMenu=document.getElementById('startMenu');
const startBtn=document.getElementById('startBtn');
let z=10;

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function renderLaunchers(){
  apps.forEach(a=>{
    const tile=document.createElement('div');
    tile.className='app-tile';
    tile.innerHTML=`<div class="tile-ico">${a.icon}</div>${a.name}`;
    tile.onclick=()=>openApp(a.id);
    appGrid.appendChild(tile);
  });
  desktopApps.forEach(id=>{
    const a=apps.find(x=>x.id===id);
    const d=document.createElement('div');
    d.className='desktop-icon';
    d.innerHTML=`<div class="ico">${a.icon}</div><div>${a.name}</div>`;
    d.ondblclick=()=>openApp(id);
    icons.appendChild(d);
  });
}
renderLaunchers();

startBtn.onclick=()=>startMenu.classList.toggle('open');
document.getElementById('desktop').addEventListener('click',()=>startMenu.classList.remove('open'));
document.getElementById('search').addEventListener('input',e=>{
  [...appGrid.children].forEach((el,i)=>{
    el.style.display=apps[i].name.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'
  });
});

function makeWindow(id,title,icon,body,w=650,h=430){
  const win=document.createElement('div');
  win.className='window show';win.dataset.id=id;
  win.style.width=w+'px';win.style.height=h+'px';
  win.style.left=(80+Math.random()*130)+'px';win.style.top=(55+Math.random()*90)+'px';
  win.innerHTML=`
    <div class="titlebar">
      <div class="title">${icon} ${title}</div>
      <div class="win-actions">
        <button onclick="minimizeWin('${id}')">—</button>
        <button onclick="maximizeWin('${id}')">▢</button>
        <button class="close" onclick="closeWin('${id}')">×</button>
      </div>
    </div>
    <div class="content">${body}</div>`;
  document.getElementById('desktop').appendChild(win);
  dragify(win);
  win.addEventListener('mousedown',()=>bringFront(win));
  bringFront(win);

  const a=apps.find(x=>x.id===id);
  const tb=document.createElement('button');
  tb.className='task-btn active';tb.dataset.app=id;tb.title=title;tb.innerHTML=icon;
  tb.onclick=()=>toggleWin(id);
  taskApps.appendChild(tb);
  return win;
}
function getWin(id){return document.querySelector(`.window[data-id="${id}"]`)}
function bringFront(w){z++;w.style.zIndex=z}
function openApp(id){
  startMenu.classList.remove('open');
  let existing=getWin(id);
  if(existing){existing.classList.add('show');bringFront(existing);syncTask();return}
  const a=apps.find(x=>x.id===id);
  let body='',w=650,h=430;
  if(id==='notes'){
    body=`<textarea id="noteArea" class="note" placeholder="Пиши тут...">${escapeHTML(localStorage.getItem('sewa_notes')||'Ласкаво просимо у SeWa Notes!')}</textarea>`;
  } else if(id==='calc'){
    body=`<div class="calc">
      <div class="calc-display" id="calcDisplay">0</div>
      ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(v=>`<button ${['÷','×','−','+','='].includes(v)?'class="accent"':''} onclick="calcPress('${v}')">${v}</button>`).join('')}
    </div>`; w=390;h=520;
  } else if(id==='terminal'){
    body=`<div class="terminal" id="terminalBox">
      <div class="term-line">SeWa OS Terminal v1.0</div>
      <div class="term-line">Введи "help" для списку команд.</div>
      <div id="termOut"></div>
      <div class="term-row"><span class="prompt">sewa@os:~$</span><input class="term-input" id="termInput" autocomplete="off"></div>
    </div>`;
  } else if(id==='settings'){
    body=`<div class="settings">
      <div class="sidebar">
        <div class="side-item active">Персоналізація</div>
        <div class="side-item">Система</div>
        <div class="side-item">Про SeWa OS</div>
      </div>
      <div class="setting-page">
        <h2 style="margin-top:0">Персоналізація</h2>
        <div class="setting-card"><b>Акцентний колір</b><div class="swatches">
          <div class="swatch" style="background:#7c3aed" onclick="setAccent('#7c3aed')"></div>
          <div class="swatch" style="background:#2563eb" onclick="setAccent('#2563eb')"></div>
          <div class="swatch" style="background:#22c55e" onclick="setAccent('#22c55e')"></div>
          <div class="swatch" style="background:#ef4444" onclick="setAccent('#ef4444')"></div>
          <div class="swatch" style="background:#f59e0b" onclick="setAccent('#f59e0b')"></div>
        </div></div>
        <div class="setting-card"><b>Шпалери</b><div class="wallpapers">
          <div class="wall w1" onclick="setWall(1)"></div>
          <div class="wall w2" onclick="setWall(2)"></div>
          <div class="wall w3" onclick="setWall(3)"></div>
        </div></div>
        <div class="setting-card"><b>SeWa OS</b><p style="color:var(--muted)">Версія 1.0 Web Edition. Усі налаштування зберігаються у браузері.</p></div>
      </div>
    </div>`;
  } else if(id==='files'){
    body=`<div class="files">
      <div class="sidebar">
        <div class="side-item active">🏠 Головна</div>
        <div class="side-item">🖥 Робочий стіл</div>
        <div class="side-item">📄 Документи</div>
        <div class="side-item">⬇ Завантаження</div>
      </div>
      <div class="file-list">
        <div class="file"><div class="ficon">📁</div>Документи</div>
        <div class="file"><div class="ficon">📁</div>Фото</div>
        <div class="file"><div class="ficon">📁</div>Проєкти</div>
        <div class="file" ondblclick="openApp('notes')"><div class="ficon">📝</div>notes.txt</div>
        <div class="file"><div class="ficon">💿</div>SeWa OS</div>
      </div>
    </div>`;
  } else if(id==='browser'){
    body=`<div class="browser">
      <div class="browserbar"><button onclick="toast('Назад')">←</button><button onclick="toast('Оновлено')">↻</button>
      <input id="urlBar" value="sewa://home"><button onclick="browserGo()">Перейти</button></div>
      <div class="browserpage" id="browserPage"><div><h1>SeWa <b>Browser</b></h1><p>Вбудований демонстраційний браузер SeWa OS. Введи адресу або пошуковий запит.</p></div></div>
    </div>`;
  } else if(id==='about'){
    body=`<div class="pad" style="display:grid;place-items:center;height:100%"><div class="system-card">
      <div class="system-logo">SeWa <b>OS</b></div><h2>Web Edition 1.0</h2>
      <p style="color:var(--muted);line-height:1.7">Міні-операційна система, створена повністю на HTML, CSS та JavaScript. Працює прямо у браузері без встановлення.</p>
      <p><b>Користувач:</b> SeWa<br><b>Тип:</b> Web Desktop<br><b>Build:</b> 2026.09</p>
    </div></div>`;
  }
  const win=makeWindow(id,a.name,a.icon,body,w,h);
  if(id==='notes'){
    document.getElementById('noteArea').addEventListener('input',e=>localStorage.setItem('sewa_notes',e.target.value));
  }
  if(id==='terminal') initTerminal();
}
function closeWin(id){const w=getWin(id);if(w)w.remove();document.querySelector(`.task-btn[data-app="${id}"]`)?.remove()}
function minimizeWin(id){getWin(id)?.classList.remove('show');syncTask()}
function maximizeWin(id){const w=getWin(id);if(!w)return;w.classList.toggle('max');bringFront(w)}
function toggleWin(id){const w=getWin(id);if(!w)return;if(w.classList.contains('show'))w.classList.remove('show');else{w.classList.add('show');bringFront(w)}syncTask()}
function syncTask(){
  document.querySelectorAll('#taskApps .task-btn').forEach(b=>{
    b.classList.toggle('active',getWin(b.dataset.app)?.classList.contains('show'))
  })
}
function dragify(win){
  const bar=win.querySelector('.titlebar');let drag=false,ox=0,oy=0;
  bar.addEventListener('mousedown',e=>{
    if(e.target.tagName==='BUTTON'||win.classList.contains('max'))return;
    drag=true;const r=win.getBoundingClientRect();ox=e.clientX-r.left;oy=e.clientY-r.top;bringFront(win)
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    win.style.left=Math.max(0,Math.min(innerWidth-120,e.clientX-ox))+'px';
    win.style.top=Math.max(0,Math.min(innerHeight-100,e.clientY-oy))+'px';
  });
  document.addEventListener('mouseup',()=>drag=false);
}
function escapeHTML(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

let calcExpr='';
function calcPress(v){
  const d=document.getElementById('calcDisplay');if(!d)return;
  if(v==='C'){calcExpr='';d.textContent='0';return}
  if(v==='⌫'){calcExpr=calcExpr.slice(0,-1);d.textContent=calcExpr||'0';return}
  if(v==='±'){if(calcExpr)calcExpr=String(-Number(calcExpr));d.textContent=calcExpr||'0';return}
  if(v==='%'){if(calcExpr)calcExpr=String(Number(calcExpr)/100);d.textContent=calcExpr||'0';return}
  if(v==='='){
    try{
      const safe=calcExpr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');
      if(!/^[0-9+\-*/.() ]+$/.test(safe))throw 0;
      calcExpr=String(Function('"use strict";return ('+safe+')')());
      d.textContent=calcExpr;
    }catch{d.textContent='Error';calcExpr=''}
    return;
  }
  calcExpr+=v;d.textContent=calcExpr;
}
function initTerminal(){
  const input=document.getElementById('termInput');
  input.focus();
  input.addEventListener('keydown',e=>{
    if(e.key!=='Enter')return;
    const cmd=input.value.trim();printTerm(`sewa@os:~$ ${cmd}`);
    runCommand(cmd);input.value='';
  });
}
function printTerm(t){const o=document.getElementById('termOut');const l=document.createElement('div');l.className='term-line';l.textContent=t;o.appendChild(l);document.getElementById('terminalBox').scrollTop=99999}
function runCommand(cmd){
  const [c,...args]=cmd.toLowerCase().split(' ');
  const commands={
    help:'Команди: help, clear, date, echo, whoami, version, apps, open [app], reboot',
    date:new Date().toString(),
    whoami:'SeWa',
    version:'SeWa OS Web Edition 1.0 (build 2026.09)',
    apps:'browser, files, notes, calc, terminal, settings, about'
  };
  if(c==='clear'){document.getElementById('termOut').innerHTML='';return}
  if(c==='echo'){printTerm(args.join(' '));return}
  if(c==='open'){if(apps.some(a=>a.id===args[0]))openApp(args[0]);else printTerm('App not found.');return}
  if(c==='reboot'){location.reload();return}
  printTerm(commands[c]??`Command not found: ${cmd}`);
}
function browserGo(){
  const q=document.getElementById('urlBar').value.trim();
  const p=document.getElementById('browserPage');
  if(!q)return;
  if(q.startsWith('sewa://')){
    p.innerHTML=`<div><h1>SeWa <b>Browser</b></h1><p>Відкрита внутрішня сторінка: ${escapeHTML(q)}</p></div>`;
  }else{
    const target=q.startsWith('http://')||q.startsWith('https://')?q:'https://www.google.com/search?q='+encodeURIComponent(q);
    window.open(target,'_blank');
    toast('Відкрито у новій вкладці');
  }
}
function setAccent(c){document.documentElement.style.setProperty('--accent',c);localStorage.setItem('sewa_accent',c);toast('Колір змінено')}
function setWall(n){
  const d=document.getElementById('desktop');d.classList.remove('wallpaper-2','wallpaper-3');
  if(n===2)d.classList.add('wallpaper-2');if(n===3)d.classList.add('wallpaper-3');
  localStorage.setItem('sewa_wall',n);toast('Шпалери змінено')
}
function applyPrefs(){
  const c=localStorage.getItem('sewa_accent');if(c)setAccent(c);
  const w=Number(localStorage.getItem('sewa_wall')||1);setWall(w);
}
function fakePower(){
  startMenu.classList.remove('open');
  document.getElementById('boot').style.display='flex';
  document.getElementById('boot').style.opacity='1';
  setTimeout(()=>location.reload(),900)
}
function updateClock(){
  const n=new Date();
  document.getElementById('clock').innerHTML=`${n.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}<br>${n.toLocaleDateString('uk-UA')}`;
}
setInterval(updateClock,1000);updateClock();

window.addEventListener('load',()=>{
  const boot=document.getElementById('boot');
  applyPrefs();
  setTimeout(()=>{boot.style.opacity='0';setTimeout(()=>boot.style.display='none',650)},1100);
});
</script>
</body>
