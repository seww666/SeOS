<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SeWa OS">
<title>SeWa OS Mobile</title>
<style>
:root{
  --accent:#7c3aed;
  --text:#fff;
  --muted:rgba(255,255,255,.68);
  --glass:rgba(20,20,24,.58);
  --glass2:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.12);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
button,input,textarea{font:inherit}
button{color:inherit}
.hidden{display:none!important}

#boot{
 position:fixed;inset:0;z-index:99999;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;
 transition:.4s ease;
}
.appleMark{font-size:58px;font-weight:900;letter-spacing:-4px}
.appleMark b{color:var(--accent)}
.bootbar{width:145px;height:4px;background:#222;border-radius:999px;overflow:hidden;margin-top:18px}
.bootbar span{display:block;height:100%;width:34%;background:#fff;border-radius:999px;animation:load 1s infinite ease}
@keyframes load{from{transform:translateX(-120%)}to{transform:translateX(420%)}}

#phone{
 position:fixed;inset:0;overflow:hidden;background:#000;
}
#wallpaper{
 position:absolute;inset:0;
 background:
 radial-gradient(circle at 25% 15%,rgba(124,58,237,.45),transparent 30%),
 radial-gradient(circle at 78% 72%,rgba(37,99,235,.34),transparent 30%),
 linear-gradient(165deg,#151527,#09090d 60%,#020204);
}
#wallpaper.w2{
 background:
 radial-gradient(circle at 20% 20%,rgba(255,100,80,.38),transparent 28%),
 radial-gradient(circle at 80% 74%,rgba(240,60,160,.32),transparent 28%),
 linear-gradient(165deg,#2a1020,#0e0b18 62%,#050507);
}
#wallpaper.w3{
 background:
 radial-gradient(circle at 30% 20%,rgba(40,220,150,.30),transparent 26%),
 radial-gradient(circle at 78% 72%,rgba(60,180,255,.25),transparent 30%),
 linear-gradient(165deg,#071714,#071018 60%,#020404);
}

#statusbar{
 position:absolute;top:0;left:0;right:0;height:calc(28px + var(--safe-top));padding-top:var(--safe-top);
 display:flex;align-items:center;justify-content:space-between;padding-left:16px;padding-right:16px;z-index:7000;
 font-size:12px;font-weight:700;
}
#statusRight{display:flex;gap:7px;align-items:center}

#lockscreen{
 position:absolute;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
 padding:calc(var(--safe-top) + 58px) 22px calc(var(--safe-bottom) + 28px);
 background:rgba(0,0,0,.05);
 transition:.42s cubic-bezier(.2,.8,.2,1);
}
#lockscreen.unlock{transform:translateY(-100%);opacity:.1}
.lockDate{font-size:17px;font-weight:600;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.lockTime{font-size:86px;font-weight:300;letter-spacing:-7px;line-height:.95;margin-top:6px;text-shadow:0 1px 18px rgba(0,0,0,.32)}
.lockWidgets{width:100%;display:flex;gap:12px;margin-top:24px}
.widget{
 flex:1;min-height:106px;border-radius:26px;padding:15px;background:rgba(255,255,255,.12);backdrop-filter:blur(28px);
 border:1px solid rgba(255,255,255,.13)
}
.widget .small{font-size:12px;color:rgba(255,255,255,.7)}
.widget .big{font-size:28px;font-weight:700;margin-top:4px}
.lockBottom{width:100%;text-align:center}
.lockActions{display:flex;justify-content:space-between;padding:0 14px}
.circleBtn{
 width:50px;height:50px;border-radius:50%;border:0;background:rgba(20,20,20,.45);backdrop-filter:blur(18px);display:grid;place-items:center;font-size:20px
}
.homeIndicator{width:132px;height:5px;background:#fff;border-radius:999px;margin:22px auto 2px;opacity:.95}
.swipeText{font-size:12px;color:rgba(255,255,255,.68);margin-top:8px}

#home{
 position:absolute;inset:calc(28px + var(--safe-top)) 0 0;z-index:1000;padding:22px 18px calc(105px + var(--safe-bottom));
 overflow:auto;
}
.topWidgets{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-bottom:26px}
.homeWidget{
 min-height:138px;border-radius:28px;padding:16px;background:rgba(255,255,255,.10);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.12)
}
.homeWidget.clockW{display:flex;flex-direction:column;justify-content:space-between}
.homeWidget .label{font-size:12px;color:var(--muted)}
.homeWidget .main{font-size:30px;font-weight:800}
.homeWidget .sub{font-size:13px;color:var(--muted)}
.appGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}
.appIcon{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;font-size:11px;cursor:pointer}
.iconBox{
 width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:29px;
 background:linear-gradient(145deg,rgba(255,255,255,.25),rgba(255,255,255,.09));
 box-shadow:0 12px 32px rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.14)
}
.appIcon:active .iconBox{transform:scale(.91)}
.pageDots{display:flex;gap:5px;justify-content:center;margin:26px 0 10px}
.pageDots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.38)}
.pageDots span.active{background:#fff}

#dock{
 position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));height:76px;z-index:3000;
 border-radius:30px;background:rgba(255,255,255,.14);backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.12);
 display:flex;align-items:center;justify-content:space-around;padding:8px 12px
}
.dockIcon{width:58px;height:58px;border:0;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.25),rgba(255,255,255,.09));font-size:28px}

.app{
 position:absolute;inset:0;z-index:5000;background:#0a0a0d;transform:translateY(100%);opacity:0;pointer-events:none;
 transition:.34s cubic-bezier(.2,.8,.2,1);padding-top:var(--safe-top);
}
.app.open{transform:none;opacity:1;pointer-events:auto}
.appHeader{
 height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);
 background:rgba(10,10,13,.88);backdrop-filter:blur(22px);position:relative;z-index:2
}
.appHeader .title{font-size:17px;font-weight:700}
.headerBtn{border:0;background:transparent;font-size:18px;padding:8px}
.appBody{height:calc(100% - 56px - var(--safe-bottom));overflow:auto;padding-bottom:calc(20px + var(--safe-bottom))}
.appHomeIndicator{position:absolute;bottom:calc(7px + var(--safe-bottom));left:50%;transform:translateX(-50%);width:132px;height:5px;background:#fff;border-radius:999px;z-index:10}

.notesArea{width:100%;height:100%;border:0;outline:0;resize:none;background:#111116;color:#fff;padding:18px;font-size:16px;line-height:1.6}
.calc{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:100%}
.calcDisplay{grid-column:1/-1;height:100px;display:flex;align-items:flex-end;justify-content:flex-end;font-size:48px;padding:10px}
.calc button{border:0;border-radius:50%;aspect-ratio:1;background:#2a2a2d;font-size:24px}
.calc .op{background:#ff9f0a}
.calc .light{background:#a5a5a8;color:#000}
.settingsList{padding:14px}
.group{background:#1b1b1f;border-radius:18px;overflow:hidden;margin-bottom:16px}
.settingRow{padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}
.settingRow:last-child{border-bottom:0}
.settingRow .left{display:flex;gap:12px;align-items:center}
.settingsIcon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:#2b2b30}
.switch{width:48px;height:28px;border-radius:999px;background:#3a3a3d;padding:2px}
.switch span{display:block;width:24px;height:24px;background:#fff;border-radius:50%;transition:.2s}
.switch.on{background:#34c759}
.switch.on span{transform:translateX(20px)}
.browserTop{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:8px}
.browserTop input{flex:1;background:#1d1d22;border:0;color:#fff;padding:11px 13px;border-radius:14px;outline:0}
.browserTop button{border:0;border-radius:14px;background:#2b2b31;padding:0 14px}
.browserPage{min-height:calc(100% - 60px);display:grid;place-items:center;text-align:center;padding:26px}
.browserPage h1{font-size:38px;margin:0}
.browserPage b{color:var(--accent)}
.browserPage p{color:var(--muted);max-width:320px}
.filesList{padding:14px}
.fileRow{display:flex;gap:12px;align-items:center;padding:14px;border-bottom:1px solid rgba(255,255,255,.08)}
.fileIcon{width:42px;height:42px;border-radius:12px;background:#202027;display:grid;place-items:center;font-size:22px}
.fileRow .meta{font-size:12px;color:var(--muted);margin-top:2px}
.gallery{padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.gallery .photo{aspect-ratio:1;background:linear-gradient(145deg,var(--accent),#3b82f6);display:grid;place-items:center;font-size:28px}
.musicBody{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}
.album{width:230px;aspect-ratio:1;border-radius:28px;background:linear-gradient(145deg,var(--accent),#2563eb);display:grid;place-items:center;font-size:76px;box-shadow:0 28px 80px rgba(0,0,0,.45)}
.musicBtns{display:flex;gap:18px;justify-content:center;margin-top:24px}
.musicBtns button{width:62px;height:62px;border-radius:50%;border:0;background:#242429;font-size:22px}
.terminal{height:100%;background:#000;color:#d9ffd9;padding:14px;font:13px/1.55 Menlo,Consolas,monospace;overflow:auto}
.termRow{display:flex;gap:6px}
.termInput{flex:1;background:transparent;border:0;outline:0;color:#d9ffd9;font:inherit}

#controlCenter{
 position:absolute;inset:0;z-index:8500;background:rgba(0,0,0,.25);backdrop-filter:blur(28px);padding:calc(var(--safe-top) + 44px) 14px calc(var(--safe-bottom) + 18px);
 opacity:0;pointer-events:none;transform:translateY(-100%);transition:.28s ease;
}
#controlCenter.open{opacity:1;pointer-events:auto;transform:none}
.ccGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ccCard{background:rgba(42,42,47,.72);border-radius:24px;padding:16px;border:1px solid rgba(255,255,255,.08)}
.toggleGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.roundToggle{aspect-ratio:1;border-radius:50%;border:0;background:#3b3b40;font-size:22px}
.roundToggle.on{background:#0a84ff}
.slider{width:100%;margin-top:12px}
.nowPlaying{margin-top:12px;display:flex;gap:12px;align-items:center}
.miniAlbum{width:58px;height:58px;border-radius:14px;background:linear-gradient(145deg,var(--accent),#2563eb);display:grid;place-items:center;font-size:28px}

#notifications{
 position:absolute;inset:0;z-index:8400;background:rgba(0,0,0,.18);backdrop-filter:blur(22px);padding:calc(var(--safe-top) + 54px) 14px calc(var(--safe-bottom) + 18px);
 opacity:0;pointer-events:none;transform:translateY(-100%);transition:.28s ease;
}
#notifications.open{opacity:1;pointer-events:auto;transform:none}
.notifTitle{font-size:28px;font-weight:800;margin-bottom:16px}
.notifCard{padding:14px;border-radius:18px;background:rgba(40,40,44,.70);border:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.notifCard b{font-size:13px}
.notifCard p{font-size:13px;color:var(--muted);margin:4px 0 0}

@media(min-width:700px){
 body::before{
  content:"SeWa OS Mobile відкривай на телефоні";
  position:fixed;inset:0;background:#08080a;color:#fff;display:grid;place-items:center;z-index:100000;font-size:24px;font-weight:700;text-align:center;padding:30px
 }
}
</style>
</head>
<body>
<div id="boot">
  <div class="appleMark">SeWa <b>OS</b></div>
  <div class="bootbar"><span></span></div>
</div>

<div id="phone">
  <div id="wallpaper"></div>

  <div id="statusbar">
    <div id="statusTime">00:00</div>
    <div id="statusRight"><span>●●●</span><span>Wi‑Fi</span><span>100%</span></div>
  </div>

  <div id="lockscreen">
    <div style="width:100%;text-align:center">
      <div class="lockDate" id="lockDate">...</div>
      <div class="lockTime" id="lockTime">00:00</div>
      <div class="lockWidgets">
        <div class="widget"><div class="small">Погода</div><div class="big">18°</div><div class="small">Мінлива хмарність</div></div>
        <div class="widget"><div class="small">SeWa OS</div><div class="big">100%</div><div class="small">Система готова</div></div>
      </div>
    </div>
    <div class="lockBottom">
      <div class="lockActions"><button class="circleBtn">🔦</button><button class="circleBtn">📷</button></div>
      <div class="swipeText">Проведи вгору, щоб відкрити</div>
      <div class="homeIndicator"></div>
    </div>
  </div>

  <div id="home">
    <div class="topWidgets">
      <div class="homeWidget clockW">
        <div class="label">Сьогодні</div>
        <div class="main" id="homeGreeting">Добрий день</div>
        <div class="sub" id="homeDate"></div>
      </div>
      <div class="homeWidget">
        <div class="label">SeWa OS</div>
        <div class="main">2.0</div>
        <div class="sub">Mobile Edition</div>
      </div>
    </div>

    <div class="appGrid" id="appGrid"></div>
    <div class="pageDots"><span class="active"></span><span></span></div>
  </div>

  <div id="dock">
    <button class="dockIcon" onclick="openApp('browser')">🌐</button>
    <button class="dockIcon" onclick="openApp('files')">📁</button>
    <button class="dockIcon" onclick="openApp('notes')">📝</button>
    <button class="dockIcon" onclick="openApp('music')">🎵</button>
  </div>

  <div id="controlCenter">
    <div class="ccGrid">
      <div class="ccCard">
        <div class="toggleGrid">
          <button class="roundToggle on" onclick="toggleRound(this)">📶</button>
          <button class="roundToggle on" onclick="toggleRound(this)">🅱️</button>
          <button class="roundToggle" onclick="toggleRound(this)">✈️</button>
          <button class="roundToggle" onclick="toggleRound(this)">📡</button>
        </div>
      </div>
      <div class="ccCard">
        <b>Музика</b>
        <div class="nowPlaying"><div class="miniAlbum">🎵</div><div><div>SeWa Track</div><div style="color:var(--muted);font-size:12px">Demo</div></div></div>
      </div>
      <div class="ccCard"><b>Яскравість</b><input class="slider" id="brightness" type="range" min="35" max="100" value="100"></div>
      <div class="ccCard"><b>Гучність</b><input class="slider" type="range" min="0" max="100" value="65"></div>
    </div>
    <div class="homeIndicator"></div>
  </div>

  <div id="notifications">
    <div class="notifTitle">Сповіщення</div>
    <div id="notifList"></div>
    <div class="homeIndicator"></div>
  </div>
</div>

<script>
const apps=[
 {id:'browser',name:'Browser',icon:'🌐'},
 {id:'files',name:'Files',icon:'📁'},
 {id:'notes',name:'Notes',icon:'📝'},
 {id:'calc',name:'Calculator',icon:'🧮'},
 {id:'gallery',name:'Photos',icon:'🖼️'},
 {id:'music',name:'Music',icon:'🎵'},
 {id:'terminal',name:'Terminal',icon:'⌨️'},
 {id:'settings',name:'Settings',icon:'⚙️'}
];
const $=s=>document.querySelector(s);
let locked=true, calcExpr='';

function renderApps(){
 const grid=$('#appGrid');
 apps.forEach(a=>{
  const e=document.createElement('div');
  e.className='appIcon';
  e.innerHTML=`<div class="iconBox">${a.icon}</div><div>${a.name}</div>`;
  e.onclick=()=>openApp(a.id);
  grid.appendChild(e);
 })
}
renderApps();

function appTemplate(id,title,body){
 let old=document.querySelector(`.app[data-id="${id}"]`);
 if(old){old.classList.add('open');return old}
 const app=document.createElement('div');
 app.className='app';app.dataset.id=id;
 app.innerHTML=`<div class="appHeader"><button class="headerBtn" onclick="closeApp('${id}')">‹</button><div class="title">${title}</div><button class="headerBtn">•••</button></div><div class="appBody">${body}</div><div class="appHomeIndicator"></div>`;
 $('#phone').appendChild(app);
 requestAnimationFrame(()=>app.classList.add('open'));
 return app;
}
function closeApp(id){document.querySelector(`.app[data-id="${id}"]`)?.classList.remove('open')}
function openApp(id){
 $('#controlCenter').classList.remove('open');$('#notifications').classList.remove('open');
 const a=apps.find(x=>x.id===id);let body='';
 if(id==='notes'){
  body=`<textarea id="notesArea" class="notesArea" placeholder="Нотатка...">${escapeHTML(localStorage.getItem('sewa_notes')||'')}</textarea>`;
 }else if(id==='calc'){
  body=`<div class="calc"><div class="calcDisplay" id="calcDisplay">0</div>${['AC','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','⌫','='].map(v=>`<button class="${['÷','×','−','+','='].includes(v)?'op':(['AC','±','%'].includes(v)?'light':'')}" onclick="calcPress('${v}')">${v}</button>`).join('')}</div>`;
 }else if(id==='settings'){
  body=`<div class="settingsList">
   <div class="group">
    <div class="settingRow"><div class="left"><div class="settingsIcon">📶</div>Wi‑Fi</div><div>SeWa Network ›</div></div>
    <div class="settingRow"><div class="left"><div class="settingsIcon">🅱️</div>Bluetooth</div><div>Увімкнено ›</div></div>
    <div class="settingRow"><div class="left"><div class="settingsIcon">📡</div>Мобільні дані</div><div class="switch on" onclick="toggleSwitch(this)"><span></span></div></div>
   </div>
   <div class="group">
    <div class="settingRow"><div class="left"><div class="settingsIcon">🎨</div>Шпалери</div><div><button onclick="setWall(1)">1</button> <button onclick="setWall(2)">2</button> <button onclick="setWall(3)">3</button></div></div>
    <div class="settingRow"><div class="left"><div class="settingsIcon">🌙</div>Темний режим</div><div class="switch on" onclick="toggleSwitch(this)"><span></span></div></div>
   </div>
   <div class="group">
    <div class="settingRow"><div class="left"><div class="settingsIcon">⚙️</div>Про систему</div><div>SeWa OS 2.0 ›</div></div>
   </div>
  </div>`;
 }else if(id==='browser'){
  body=`<div class="browserTop"><input id="url" value="sewa://home"><button onclick="goBrowser()">Go</button></div><div class="browserPage" id="browserPage"><div><h1>SeWa <b>Browser</b></h1><p>Мобільний браузер SeWa OS. Введи сайт або пошук.</p></div></div>`;
 }else if(id==='files'){
  body=`<div class="filesList">
   <div class="fileRow"><div class="fileIcon">📁</div><div><b>Документи</b><div class="meta">12 файлів</div></div></div>
   <div class="fileRow"><div class="fileIcon">🖼️</div><div><b>Фото</b><div class="meta">34 елементи</div></div></div>
   <div class="fileRow"><div class="fileIcon">📦</div><div><b>Завантаження</b><div class="meta">7 файлів</div></div></div>
   <div class="fileRow" onclick="openApp('notes')"><div class="fileIcon">📝</div><div><b>notes.txt</b><div class="meta">SeWa Notes</div></div></div>
  </div>`;
 }else if(id==='gallery'){
  body=`<div class="gallery">${['🌆','🌌','🏙️','🌊','🌲','🌃','🎮','⚽','🏁','🌄','🌉','🌙'].map(x=>`<div class="photo">${x}</div>`).join('')}</div>`;
 }else if(id==='music'){
  body=`<div class="musicBody"><div><div class="album">🎵</div><h2>SeWa Track</h2><div style="color:var(--muted)">Demo · SeWa Music</div><div class="musicBtns"><button>⏮</button><button onclick="notify('Music','Відтворення SeWa Track')">▶</button><button>⏭</button></div></div></div>`;
 }else if(id==='terminal'){
  body=`<div class="terminal" id="terminal"><div>SeWa OS Terminal</div><div>help — список команд</div><div id="termOut"></div><div class="termRow"><span>sewa@ios:~$</span><input id="termInput" class="termInput"></div></div>`;
 }
 const app=appTemplate(id,a.name,body);
 if(id==='notes')$('#notesArea').addEventListener('input',e=>localStorage.setItem('sewa_notes',e.target.value));
 if(id==='terminal')initTerminal();
}

function escapeHTML(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function calcPress(v){
 const d=$('#calcDisplay');
 if(v==='AC'){calcExpr='';d.textContent='0';return}
 if(v==='⌫'){calcExpr=calcExpr.slice(0,-1);d.textContent=calcExpr||'0';return}
 if(v==='±'){if(calcExpr)calcExpr=String(-Number(calcExpr));d.textContent=calcExpr||'0';return}
 if(v==='%'){if(calcExpr)calcExpr=String(Number(calcExpr)/100);d.textContent=calcExpr||'0';return}
 if(v==='='){
  try{let s=calcExpr.replaceAll('×','*').replaceAll('÷','/').replaceAll('−','-');if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;calcExpr=String(Function('"use strict";return ('+s+')')());d.textContent=calcExpr}catch{calcExpr='';d.textContent='Error'}return
 }
 calcExpr+=v;d.textContent=calcExpr;
}
function toggleSwitch(el){el.classList.toggle('on')}
function toggleRound(el){el.classList.toggle('on')}
function setWall(n){$('#wallpaper').className=n>1?'w'+n:'';localStorage.setItem('sewa_wall',n)}
function goBrowser(){
 const q=$('#url').value.trim();
 if(q.startsWith('sewa://'))$('#browserPage').innerHTML=`<div><h1>SeWa <b>Browser</b></h1><p>${escapeHTML(q)}</p></div>`;
 else window.open(q.startsWith('http')?q:'https://www.google.com/search?q='+encodeURIComponent(q),'_blank');
}

function notify(title,text){
 const arr=JSON.parse(localStorage.getItem('sewa_notifs')||'[]');
 arr.unshift({title,text,time:new Date().toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})});
 localStorage.setItem('sewa_notifs',JSON.stringify(arr.slice(0,8)));
 renderNotifications();
}
function renderNotifications(){
 const arr=JSON.parse(localStorage.getItem('sewa_notifs')||'[]');
 $('#notifList').innerHTML=arr.length?arr.map(n=>`<div class="notifCard"><b>${escapeHTML(n.title)} · ${n.time}</b><p>${escapeHTML(n.text)}</p></div>`).join(''):`<div class="notifCard"><b>Немає сповіщень</b><p>Тут з'являться нові повідомлення.</p></div>`;
}
renderNotifications();

function initTerminal(){
 const input=$('#termInput');
 input.focus();
 input.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const cmd=input.value.trim(),o=$('#termOut');const line=document.createElement('div');line.textContent='sewa@ios:~$ '+cmd;o.appendChild(line);
  if(cmd==='help')out('help, clear, date, whoami, version, notify');
  else if(cmd==='clear')o.innerHTML='';
  else if(cmd==='date')out(new Date().toString());
  else if(cmd==='whoami')out('SeWa');
  else if(cmd==='version')out('SeWa OS Mobile 2.0');
  else if(cmd.startsWith('notify')){notify('Terminal',cmd.slice(6).trim()||'Test');out('Notification sent')}
  else out('command not found');
  input.value='';
  function out(t){const x=document.createElement('div');x.textContent=t;o.appendChild(x)}
 });
}

function updateTime(){
 const d=new Date();
 const t=d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
 $('#statusTime').textContent=t;$('#lockTime').textContent=t;
 $('#lockDate').textContent=d.toLocaleDateString('uk-UA',{weekday:'long',day:'numeric',month:'long'});
 $('#homeDate').textContent=d.toLocaleDateString('uk-UA',{day:'numeric',month:'long'});
 $('#homeGreeting').textContent=d.getHours()<12?'Доброго ранку':d.getHours()<18?'Добрий день':'Добрий вечір';
}
updateTime();setInterval(updateTime,1000);

const savedWall=Number(localStorage.getItem('sewa_wall')||1);setWall(savedWall);
$('#brightness').addEventListener('input',e=>$('#wallpaper').style.filter=`brightness(${Number(e.target.value)/100})`);

let sy=0,sx=0;
document.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
 const y=e.changedTouches[0].clientY,x=e.changedTouches[0].clientX;
 const dy=y-sy,dx=x-sx;
 if(locked && sy>innerHeight-150 && dy<-65){
   locked=false;$('#lockscreen').classList.add('unlock');setTimeout(()=>$('#lockscreen').classList.add('hidden'),430);return;
 }
 if(!locked && sy<55 && sx>innerWidth*0.55 && dy>70){
   $('#controlCenter').classList.add('open');$('#notifications').classList.remove('open');return;
 }
 if(!locked && sy<55 && sx<innerWidth*0.55 && dy>70){
   $('#notifications').classList.add('open');$('#controlCenter').classList.remove('open');return;
 }
 if($('#controlCenter').classList.contains('open') && dy<-65){$('#controlCenter').classList.remove('open')}
 if($('#notifications').classList.contains('open') && dy<-65){$('#notifications').classList.remove('open')}
},{passive:true});

window.addEventListener('load',()=>{
 setTimeout(()=>{$('#boot').style.opacity='0';setTimeout(()=>$('#boot').remove(),420)},800);
});
</script>
</body>
</html>
